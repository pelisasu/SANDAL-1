name: TITAN V4 TANI HYBRID

on:
  schedule:
    - cron: '*/15 * * * *'  # Tiap 15 menit kayak #52 lu
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets aiohttp numpy requests pandas python-dateutil pytz websocket-client urllib3 certifi python-telegram-bot
          # Buat folder state biar DNA gak reset (fix cache #48-#51 lu)
          mkdir -p .github/state

      - name: Restore DNA & Memory (Cache FIX dari #51)
        uses: actions/cache@v4
        with:
          path: |
            .dna_tani_v4.json
            .memory_tani_v4.json
            titan_v4_state.json
            .last_tani_v9.json
          key: tani-dna-v4-${{ hashFiles('**/TITAN_V4_TANI_HYBRID_FINAL.py') }}
          restore-keys: |
            tani-dna-v4-

      - name: Run TITAN V4 Hybrid
        env:
          TARGET_SYMBOL: frxXAUUSD
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STATE_FILE: titan_v4_state.json
        run: |
          echo "=== TITAN V4 TANI HYBRID $(date) ==="
          timeout 500 python TITAN_V4_TANI_HYBRID_FINAL.py || echo "Timeout 500s - normal for live bot"
          
      - name: Post Checkout Repository
        if: always()
        run: |
          echo "Node 20 is being deprecated - workflow running with Node 24"
          ls -lh *.json || echo "No state yet"
          cat titan_v4_state.json || echo "No active trade"

      - name: Save logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: titan-v4-logs
          path: |
            *.log
            *.json
