name: TITAN V4 TANI HYBRID

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets aiohttp numpy requests

      - name: Restore State
        uses: actions/cache@v4
        with:
          path: |
            titan_v4_state.json
            .dna_tani_v4.json
            .memory_tani_v4.json
            .last_tani_v9.json
          key: titan-v4-live-${{ github.run_number }}
          restore-keys: |
            titan-v4-live-

      - name: Run TITAN V4.1 PANEN 5 JAM
        env:
          TARGET_SYMBOL: frxXAUUSD
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STATE_FILE: titan_v4_state.json
        run: |
          echo "=== TITAN V4.1 PANEN $(date) 19200s ==="
          ls -lh *.py
          if [ -f "bot_core.py" ]; then
            echo "Found bot_core.py - Running 5h20m"
            timeout --preserve-status 19200 python bot_core.py || echo "Live 5h20m selesai - normal"
          else
            echo "No bot file found"
            ls -lh
            exit 1
          fi

      - name: Save State Info
        if: always()
        run: |
          ls -lh *.json || echo "No state yet"
          cat titan_v4_state.json 2>/dev/null || echo "No active trade"
