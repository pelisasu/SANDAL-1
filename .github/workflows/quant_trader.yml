name: Titan Supreme Quant Engine

on:
  schedule:
    - cron: '0 */6 * * *' # Fail-safe
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: quant-singleton-engine
  cancel-in-progress: false

jobs:
  execute-titan-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Production Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Quant Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore State (Anti Lupa Posisi)
        run: |
          if [ -f titan_v3_state.json ]; then
            echo "State found from previous commit"
            cat titan_v3_state.json
          else
            echo "No state, fresh start"
          fi
        continue-on-error: true

      - name: Run Engine with Lifetime Guard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_SYMBOL: "frxXAUUSD"
        run: |
          timeout --preserve-status 19200s python bot_core.py || true

      - name: Save State to Repo (Biar Gak Hilang Pas Rotasi)
        if: always()
        run: |
          git config --global user.name "Titan Bot"
          git config --global user.email "bot@titan.quant"
          if [ -f titan_v3_state.json ]; then
            git add titan_v3_state.json
            git diff --staged --quiet || git commit -m "chore: persist state [skip ci]"
            git push origin main || echo "Push state failed, will retry next rotation"
          fi

      - name: Self-Trigger Next Rotation
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next rotation..."
          sleep 10
          gh workflow run "Titan Supreme Quant Engine" --ref main || true
